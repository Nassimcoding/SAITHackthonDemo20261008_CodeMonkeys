<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/x-icon" href="https://openlayers.org/favicon.ico" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Using OpenLayers with Vite</title>
  <!-- 1. Bootstrap 5 CSS 放在這裡 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
  <!-- 2. UI 結構放在這裡 (對應圖片的佈局) -->

  <!-- 頂部導覽列 (Navbar) -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
      <a class="navbar-brand" href="#">CampusMap</a>
      <ul class="navbar-nav me-auto">
        <li class="nav-item">
          <a class="nav-link active" href="#">Map</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="people.html">People</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="tasks.html">Tasks</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="messages.html">Messages</a>
        </li>
      </ul>
    </div>
  </nav>

  <!-- 主要版面區塊 (使用 Bootstrap Grid) -->
  <div class="container-fluid app-container">
    <div class="row h-100">

      <!-- 左側面板：人員清單 (People) -->
      <div class="col-md-3 sidebar bg-light border-end p-3">
        <h5>Online (12)</h5>
        <!-- 這裡放置你的朋友列表 UI，例如 Bootstrap 的 List Group -->
        <ul class="list-group list-group-flush">
          <li class="list-group-item bg-transparent">Alice Wang</li>
          <li class="list-group-item bg-transparent">Bob Chen</li>
        </ul>
      </div>

      <!-- 中間面板：地圖區塊 -->
      <div class="col-md-6 p-0" style="position: relative;">
        <!-- 你的 OpenLayers 地圖容器 -->
        <div id="map"></div>
      </div>

      <!-- 右側面板：狀態與詳細資訊 (Stats & Selected Student) -->
      <div class="col-md-3 sidebar bg-light border-start p-3">
        <h5>Selected Student</h5>
        <!-- 這裡放置右側資訊 UI -->
        <div class="card mb-3">
          <div class="card-body">
            <h6 class="card-title">Alice Wang</h6>
            <p class="card-text text-muted">Online • 1 min ago</p>
          </div>
        </div>

        <h5>Quick Stats</h5>
        <!-- 這裡放置統計數據卡片 -->
      </div>

    </div>
  </div>
  <script type="module" src="./main.js"></script>




</body>

</html>
