<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="https://openlayers.org/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Using OpenLayers with Vite</title>
    <!-- 1. Bootstrap 5 CSS 放在這裡 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="script/tasks.js"></script>
</head>

<body>
    <!-- 2. UI 結構放在這裡 (對應圖片的佈局) -->
    <div class="container-fluid flex-grow-1 overflow-hidden">
        <div class="row h-100">
            <!-- 頂部導覽列 (Navbar) -->
            <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
                <div class="container-fluid">
                    <a class="navbar-brand" href="index.html">CampusMap</a>
                    <ul class="navbar-nav me-auto">
                        <li class="nav-item">
                            <a class="nav-link" href="index.html">Map</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="people.html">People</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link active" href="tasks.html">Tasks</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="messages.html">Messages</a>
                        </li>
                    </ul>
                </div>
            </nav>


            <!-- 左側邊欄：h-100, overflow-y-auto 讓列表可以獨立滾動 -->
            <div class="col-md-4 col-lg-3 h-100 overflow-y-auto bg-light border-end p-3 d-flex flex-column">

                <!-- 1. Add Friend 按鈕 -->
                <button class="btn btn w-100 mb-3" onclick="showView('view-add-friend')">
                    Tasks
                </button>


                <!-- 3 & 4. 上線 (Online) 區塊 -->
                <!-- 進行中的任務 (Processing) 區塊 -->
                <div class="mb-2">
                    <!-- 展開/收合按鈕 -->
                    <button
                        class="btn btn-light w-100 text-start d-flex justify-content-between align-items-center fw-bold"
                        type="button" onclick="toggleProcessingTasks()">
                        <span>🟢 Processing (2)</span>
                        <small>▼</small>
                    </button>

                    <!-- 任務清單列表 -->
                    <div class="mt-2" id="processingTasksList" style="display: block;">
                        <div class="list-group list-group-flush">

                            <!-- 任務 A -->
                            <button
                                class="list-group-item list-group-item-action d-flex align-items-center bg-transparent border-0"
                                onclick="showTaskDetail('Update SAIT Cyber Security Lab', 'Due: Oct 10, 2026 - 14:00 PM', 'High Priority')">
                                <!-- 將原本的大頭貼換成任務圖示 -->
                                <div class="rounded-circle me-3 bg-primary text-white d-flex align-items-center justify-content-center flex-shrink-0"
                                    style="width: 40px; height: 40px;">
                                    <svg width="20" height="20" fill="currentColor" viewBox="0 0 16 16">
                                        <path
                                            d="M2 2a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V2zm10-1H4a1 1 0 0 0-1 1v12a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1V2a1 1 0 0 0-1-1z" />
                                        <path
                                            d="M10.854 7.854a.5.5 0 0 0-.708-.708L7.5 9.793 6.354 8.646a.5.5 0 1 0-.708.708l1.5 1.5a.5.5 0 0 0 .708 0l3-3z" />
                                    </svg>
                                </div>
                                <div>
                                    <!-- 任務名稱 -->
                                    <div class="text-dark fw-medium text-start">Update SAIT Cyber Security Lab</div>
                                    <!-- 任務日期與時間 -->
                                    <div class="text-secondary small text-start">Due: Oct 10, 2026 - 14:00 PM</div>
                                </div>
                            </button>

                            <!-- 任務 B -->
                            <button
                                class="list-group-item list-group-item-action d-flex align-items-center bg-transparent border-0"
                                onclick="showTaskDetail('Review C# backend code', 'Due: Oct 15, 2026 - 09:30 AM', 'Medium Priority')">
                                <div class="rounded-circle me-3 bg-secondary text-white d-flex align-items-center justify-content-center flex-shrink-0"
                                    style="width: 40px; height: 40px;">
                                    <svg width="20" height="20" fill="currentColor" viewBox="0 0 16 16">
                                        <path
                                            d="M2 2a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V2zm10-1H4a1 1 0 0 0-1 1v12a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1V2a1 1 0 0 0-1-1z" />
                                        <path
                                            d="M10.854 7.854a.5.5 0 0 0-.708-.708L7.5 9.793 6.354 8.646a.5.5 0 1 0-.708.708l1.5 1.5a.5.5 0 0 0 .708 0l3-3z" />
                                    </svg>
                                </div>
                                <div>
                                    <div class="text-dark fw-medium text-start">Review C# backend code</div>
                                    <div class="text-secondary small text-start">Due: Oct 15, 2026 - 09:30 AM</div>
                                </div>
                            </button>

                        </div>
                    </div>
                </div>
                <!-- 5. 下線 (Offline) 區塊 -->
                <div class="mb-auto"> <!-- mb-auto 把下方的隱私權推到底部 -->
                    <button
                        class="btn btn-light w-100 text-start d-flex justify-content-between align-items-center fw-bold text-muted"
                        type="button" onclick="toggleOfflineList()">
                        <span>⚪ Offline (1)</span>
                        <small>▼</small>
                    </button>


                    <div class="collapse mt-2" id="offlineList" style="display: block;">
                        <div class="list-group list-group-flush opacity-75">
                            <button
                                class="list-group-item list-group-item-action d-flex align-items-center bg-transparent border-0"
                                onclick="showFriendDetail('Cathy Lin', 'Last seen 2 hours ago', 'https://ui-avatars.com/api/?name=Cathy+Lin&background=cccccc', 'Business, Year 2')">
                                <img src="https://ui-avatars.com/api/?name=Cathy+Lin&background=cccccc"
                                    class="rounded-circle me-3" width="40" height="40" alt="Avatar">
                                <div>
                                    <div class="text-dark fw-medium">Cathy Lin</div>
                                    <div class="text-secondary small">Last seen 2 hours ago</div>
                                </div>
                            </button>
                        </div>
                    </div>
                </div>



            </div>
            <!-- 7. 右側主顯示區：加入 h-100, overflow-y-auto 跟 p-4 內距 -->
            <div class="col-md-8 col-lg-9 h-100 overflow-y-auto bg-white p-4">

                <!-- 預設歡迎畫面 (預設顯示) -->
                <div id="view-default" class="detail-view text-center mt-5">
                    <h3 class="text-muted">Select a task to view details</h3>
                </div>

                <!-- 視圖：任務詳細資訊 (預設加上 d-none 隱藏) -->
                <div id="view-task-detail" class="detail-view d-none">
                    <div class="card shadow-sm border-0">
                        <div class="card-body p-5">

                            <!-- 任務優先級標籤 -->
                            <span id="detail-priority" class="badge bg-primary mb-3 px-3 py-2">High Priority</span>

                            <!-- 任務名稱 -->
                            <h2 id="detail-task-name" class="fw-bold mb-3">Task Name</h2>

                            <!-- 任務日期與時間 -->
                            <p class="text-secondary fw-medium mb-4 d-flex align-items-center">
                                <span class="fs-5 me-2">🕒</span>
                                <span id="detail-task-time">Due: Date and Time</span>
                            </p>

                            <!-- 任務詳細描述區塊 -->
                            <div class="bg-light p-4 rounded text-start mb-4">
                                <h6 class="fw-bold border-bottom pb-2">Task Description</h6>
                                <p id="detail-task-desc" class="mb-0 text-secondary">
                                    Here is the description of the task...
                                </p>
                            </div>

                            <!-- 任務操作按鈕 -->
                            <div class="mt-4 border-top pt-4">
                                <button class="btn btn-success me-2 fw-bold">✓ Mark as Complete</button>
                                <button class="btn btn-outline-secondary me-2">Edit Task</button>
                                <button class="btn btn-outline-danger">Delete</button>
                            </div>
                        </div>
                    </div>
                </div>

            </div>

        </div>
    </div>
</body>
