<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kinship - Social Map</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
        #map { position: absolute; top: 0; bottom: 0; width: 100%; z-index: 0; }
        .slide-panel { transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1); }
        .leaflet-default-icon-path { background-image: none; }
    </style>
</head>
<body class="relative w-screen h-screen overflow-hidden bg-orange-50">

    <!-- The Map Container -->
    <div id="map"></div>

    <!-- Top Floating Header -->
    <div class="absolute top-6 left-1/2 transform -translate-x-1/2 z-10 w-[90%] max-w-md pointer-events-auto">
        <div class="bg-white/80 backdrop-blur-md border border-white/60 px-5 py-3 rounded-2xl shadow-xl flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-orange-500 to-amber-400 flex items-center justify-center text-white font-bold shadow-md shadow-orange-500/20 text-lg" id="headerEmoji">
                    🚲
                </div>
                <div>
                    <h1 class="text-sm font-bold text-gray-800" id="headerTitle">Cycling to Prince's Island</h1>
                    <p class="text-xs text-orange-600 font-medium" id="headerSub">Pathways • 2 friends riding</p>
                </div>
            </div>
            <button onclick="toggleList()" class="text-xs font-semibold bg-orange-100 text-orange-700 px-3 py-1.5 rounded-xl hover:bg-orange-200 transition-colors">
                🛒 List
            </button>
        </div>
    </div>

    <!-- Activity Selector Bar -->
    <div class="absolute top-20 left-1/2 transform -translate-x-1/2 z-10 w-[90%] max-w-md flex gap-2 overflow-x-auto pb-2 pointer-events-auto">
        <button onclick="switchActivity('bike', 51.0550, -114.0750, '🚲', 'Cycling to Prince\'s Island', 'Pathways • 2 riders')" class="px-3 py-1.5 bg-white/90 backdrop-blur-md border border-orange-200 rounded-xl text-xs font-semibold text-gray-700 shadow-sm hover:bg-orange-500 hover:text-white transition-all whitespace-nowrap">
            🚲 Cycling
        </button>
        <button onclick="switchActivity('coffee', 51.0500, -114.0850, '☕', 'Coffee & Pastries', 'Stephen Avenue • 3 people')" class="px-3 py-1.5 bg-white/90 backdrop-blur-md border border-orange-200 rounded-xl text-xs font-semibold text-gray-700 shadow-sm hover:bg-orange-500 hover:text-white transition-all whitespace-nowrap">
            ☕ Cafe Meetup
        </button>
        <button onclick="switchActivity('soccer', 51.0380, -114.0600, '⚽', 'Turf Soccer Match', 'Stampede Park • 5 players')" class="px-3 py-1.5 bg-white/90 backdrop-blur-md border border-orange-200 rounded-xl text-xs font-semibold text-gray-700 shadow-sm hover:bg-orange-500 hover:text-white transition-all whitespace-nowrap">
            ⚽ Soccer
        </button>
    </div>

    <!-- Bottom Floating Action Bar -->
    <div class="absolute bottom-8 left-1/2 transform -translate-x-1/2 z-10 w-[90%] max-w-md flex flex-col gap-3 pointer-events-auto">
        <button onclick="toggleDemo()" id="actionBtn" class="w-full py-4 bg-gradient-to-r from-orange-500 to-amber-500 text-white font-bold rounded-2xl shadow-xl shadow-orange-500/30 hover:opacity-95 transition-all transform active:scale-95">
            Simulate Movement
        </button>
    </div>

    <!-- Slide-Up Task Drawer -->
    <div id="listDrawer" class="absolute bottom-0 left-0 w-full h-[55vh] bg-white/90 backdrop-blur-2xl border-t border-white/60 shadow-[0_-20px_50px_rgba(0,0,0,0.15)] rounded-t-[32px] z-50 flex flex-col slide-panel transform translate-y-full pointer-events-auto">
        <div class="flex flex-col items-center p-5 border-b border-gray-100 relative">
            <div class="w-12 h-1.5 bg-gray-300 rounded-full mb-3 cursor-pointer" onclick="toggleList()"></div>
            <h2 class="text-xl font-bold text-gray-800">Event Checklist</h2>
            <p class="text-xs text-gray-400 mt-0.5">Tap items to check them off</p>
            <button onclick="toggleList()" class="absolute top-5 right-5 text-gray-400 hover:text-gray-600 bg-gray-100 w-8 h-8 rounded-full flex items-center justify-center">
                ✕
            </button>
        </div>
        <div class="flex-1 overflow-y-auto p-6 space-y-3" id="taskList"></div>
    </div>

    <script>
        const destinationCoords = [51.0447, -114.0719];
        const map = L.map('map', { zoomControl: false }).setView(destinationCoords, 14);

        L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
            maxZoom: 19,
            subdomains: 'abcd',
            attribution: '&copy; OpenStreetMap contributors &copy; CARTO'
        }).addTo(map);

        // Destination Marker
        const destHtml = `
            <div class="relative flex items-center justify-center w-14 h-14">
                <div class="absolute w-full h-full bg-orange-400 rounded-full animate-ping opacity-50"></div>
                <div class="relative w-8 h-8 bg-gradient-to-tr from-orange-600 to-amber-500 rounded-full border-2 border-white shadow-xl flex items-center justify-center text-white text-sm font-bold">📍</div>
            </div>`;
        L.marker(destinationCoords, { icon: L.divIcon({ html: destHtml, className: '', iconSize: [56, 56], iconAnchor: [28, 28] }) }).addTo(map);

        // Activity Character Marker
        let currentStart = [51.0550, -114.0750];
        let currentLat = currentStart[0];
        let currentLng
